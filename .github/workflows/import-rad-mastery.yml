name: Import Rad Mastery ZIP

on:
  push:
    branches: [main]
    paths:
      - 'Rad_Mastery*.zip'
      - 'rad-mastery*.zip'
      - 'rad_mastery*.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f \( -iname 'Rad_Mastery*.zip' -o -iname 'rad-mastery*.zip' -o -iname 'rad_mastery*.zip' \) -print -quit)"
          if [ -z "$ZIP" ]; then
            echo 'No Rad Mastery ZIP found.' >&2
            exit 1
          fi
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP='${{ steps.zip.outputs.path }}'
          rm -rf .rad-import
          mkdir .rad-import
          unzip -q "$ZIP" -d .rad-import

          SRC='.rad-import'
          FIRST="$(find .rad-import -mindepth 1 -maxdepth 1 -type d -print -quit || true)"
          FILES_AT_ROOT="$(find .rad-import -mindepth 1 -maxdepth 1 -type f -print -quit || true)"
          DIR_COUNT="$(find .rad-import -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          if [ -z "$FILES_AT_ROOT" ] && [ "$DIR_COUNT" = '1' ] && [ -n "$FIRST" ]; then
            SRC="$FIRST"
          fi

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '*.zip' \
            "$SRC"/ ./

          rm -rf .rad-import
          rm -f "$ZIP"

      - name: Keep deployment workflow
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/import-rad-mastery.yml || true

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git commit -m 'Import Rad Mastery application'
          git push origin main
