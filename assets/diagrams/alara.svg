<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">ALARA protection principles</title><desc id="d">Diagram of time, distance, and shielding.</desc><rect width="1000" height="420" rx="28" fill="#0d1014"/><g font-family="Arial" text-anchor="middle"><circle cx="205" cy="205" r="115" fill="#151a20" stroke="#d79a38" stroke-width="4"/><circle cx="500" cy="205" r="115" fill="#151a20" stroke="#5fb7ff" stroke-width="4"/><circle cx="795" cy="205" r="115" fill="#151a20" stroke="#ff7a21" stroke-width="4"/><text x="205" y="185" fill="#fff" font-size="32" font-weight="700">TIME</text><text x="205" y="225" fill="#aeb5bf" font-size="20">Minimize beam-on time</text><text x="500" y="185" fill="#fff" font-size="32" font-weight="700">DISTANCE</text><text x="500" y="225" fill="#aeb5bf" font-size="20">Step back from scatter</text><text x="795" y="185" fill="#fff" font-size="32" font-weight="700">SHIELDING</text><text x="795" y="225" fill="#aeb5bf" font-size="20">Use barriers correctly</text><text x="500" y="380" fill="#d79a38" font-size="22" font-weight="700">ALARA = As Low As Reasonably Achievable</text></g></svg>
