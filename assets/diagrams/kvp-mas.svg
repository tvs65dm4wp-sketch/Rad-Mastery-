<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">kVp and mAs comparison</title><desc id="d">Diagram comparing kVp with beam energy and mAs with photon quantity.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a0c10"/><stop offset="1" stop-color="#171a20"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#d69b39"/><stop offset="1" stop-color="#ff7a21"/></linearGradient></defs><rect width="1000" height="420" rx="28" fill="url(#bg)"/><g font-family="Arial"><text x="100" y="85" fill="#fff" font-size="34" font-weight="700">kVp</text><text x="570" y="85" fill="#fff" font-size="34" font-weight="700">mAs</text><text x="100" y="125" fill="#aab2bd" font-size="20">Primarily beam energy / penetration</text><text x="570" y="125" fill="#aab2bd" font-size="20">Primarily photon quantity</text><rect x="100" y="175" width="320" height="28" rx="14" fill="#303640"/><rect x="100" y="175" width="250" height="28" rx="14" fill="url(#g)"/><rect x="570" y="175" width="320" height="28" rx="14" fill="#303640"/><rect x="570" y="175" width="170" height="28" rx="14" fill="#5fb7ff"/><text x="100" y="255" fill="#fff" font-size="22">Higher kVp → more penetration</text><text x="570" y="255" fill="#fff" font-size="22">Higher mAs → more photons</text><text x="100" y="310" fill="#aab2bd" font-size="18">Also influences receptor exposure and scatter.</text><text x="570" y="310" fill="#aab2bd" font-size="18">Directly proportional to x-ray quantity.</text><text x="100" y="365" fill="#d69b39" font-size="18" font-weight="700">Do not treat these as interchangeable controls.</text></g></svg>
