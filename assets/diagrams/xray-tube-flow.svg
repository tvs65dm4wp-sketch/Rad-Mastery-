<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">X-ray tube electron flow</title><desc id="d">Simple diagram showing cathode filament, electron flow, tungsten target, heat, and x-ray beam.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b0d11"/><stop offset="1" stop-color="#171b21"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#d59a37"/><stop offset="1" stop-color="#ff7b22"/></linearGradient></defs><rect width="1000" height="420" rx="28" fill="url(#bg)"/><rect x="90" y="90" width="820" height="220" rx="110" fill="none" stroke="#505864" stroke-width="6"/><g font-family="Arial" fill="#eef2f6"><text x="120" y="60" font-size="26" font-weight="700">Cathode (−)</text><text x="760" y="60" font-size="26" font-weight="700">Anode (+)</text><text x="415" y="385" font-size="22">Electron acceleration → target interaction → x-ray production</text></g><rect x="145" y="165" width="55" height="70" rx="10" fill="#d59a37"/><path d="M145 200h-30M200 200h35" stroke="#ff9a3d" stroke-width="8" stroke-linecap="round"/><polygon points="770,130 845,200 770,270 720,200" fill="#87909d" stroke="#d7dce2" stroke-width="4"/><circle cx="748" cy="200" r="20" fill="#ff7b22" opacity=".8"/><g fill="#5fb7ff"><circle cx="280" cy="200" r="9"/><circle cx="360" cy="200" r="9"/><circle cx="440" cy="200" r="9"/><circle cx="520" cy="200" r="9"/><circle cx="600" cy="200" r="9"/><circle cx="680" cy="200" r="9"/></g><path d="M248 200H700" stroke="#5fb7ff" stroke-width="3" stroke-dasharray="10 12"/><g stroke="url(#gold)" stroke-width="5" stroke-linecap="round"><path d="M785 185L900 115"/><path d="M792 200L925 200"/><path d="M785 215L900 285"/></g><g font-family="Arial" font-size="18" fill="#b6bdc7"><text x="120" y="330">Heated filament releases electrons</text><text x="660" y="330">Most energy → heat</text><text x="820" y="330">Small fraction → x-rays</text></g></svg>
